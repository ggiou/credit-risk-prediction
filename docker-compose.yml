services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-credit_risk}
      MYSQL_USER: ${DB_USERNAME:-spring_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정해야 합니다}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env에 설정해야 합니다}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-server:
    build: ./ai-server
    environment:
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-miribom-lgbm-v0.3}
      AI_FEATURE_SCHEMA_VERSION: ${AI_FEATURE_SCHEMA_VERSION:-v1}
      AI_ALLOW_RULE_BASED_FALLBACK: ${AI_ALLOW_RULE_BASED_FALLBACK:-true}
      AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-server/models:/app/models:ro

  spring-app:
    build:
      context: .
      dockerfile: spring-app/Dockerfile
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-credit_risk}
      DB_USERNAME: ${DB_USERNAME:-spring_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE:-DISABLED}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-http://ai-server:8000}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-miribom-lgbm-v0.3}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ai-server:
        condition: service_started

volumes:
  mysql-data:
